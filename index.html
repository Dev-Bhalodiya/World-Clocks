<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meridian — World Clock</title>
  <meta name="description" content="A minimal dark world clock. Add any time zone, watch each city's sky change, and scrub through time to plan across the globe.">
  <meta name="theme-color" content="#050912">
  <meta property="og:title" content="Meridian — World Clock">
  <meta property="og:description" content="A minimal dark world clock where every city carries its own sky.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <header class="top">
      <a class="brand" href="./" aria-label="Meridian home">
        <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <circle cx="16" cy="16" r="12.5"/>
          <ellipse cx="16" cy="16" rx="5.2" ry="12.5"/>
          <path d="M3.5 16h25" stroke-opacity=".55"/>
          <circle cx="16" cy="3.5" r="1.9" fill="var(--sun)" stroke="none"/>
        </svg>
        <span>Meridian</span>
      </a>

      <div class="top-actions">
        <button id="addBtn" class="btn btn-solid" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Add city
          <kbd>/</kbd>
        </button>

        <div class="pop-wrap">
          <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settings">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>
          </button>
          <div id="settings" class="popover" hidden>
            <p id="saveNote" class="note"></p>
            <div class="opt">
              <span class="opt-label" id="perRowLabel">Clocks per row</span>
              <div class="seg" id="perRowSeg" role="radiogroup" aria-labelledby="perRowLabel">
                <button type="button" role="radio" aria-checked="false" data-v="1">1</button>
                <button type="button" role="radio" aria-checked="false" data-v="2">2</button>
                <button type="button" role="radio" aria-checked="false" data-v="3">3</button>
                <button type="button" role="radio" aria-checked="false" data-v="4">4</button>
              </div>
            </div>
            <button class="row" type="button" role="switch" aria-checked="false" id="sw24">
              <span>24-hour clock</span><i class="knob"></i>
            </button>
            <button class="row" type="button" role="switch" aria-checked="true" id="swSec">
              <span>Show seconds</span><i class="knob"></i>
            </button>
            <button class="row" type="button" id="shareBtn"><span id="shareLabel">Copy link to these clocks</span></button>
            <button class="row row-quiet" type="button" id="resetBtn">Reset to default cities</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="shared" class="banner" role="status" hidden>
        <span id="sharedText"></span>
        <button id="sharedUse" class="btn btn-solid btn-sm" type="button">Use these</button>
        <button id="sharedKeep" class="btn btn-quiet btn-sm" type="button">Keep mine</button>
      </div>
      <section id="grid" class="grid" aria-label="Clocks"></section>

      <div id="empty" class="empty" hidden>
        <h2>No clocks yet</h2>
        <p>Add a city or a time zone to get started.</p>
        <button id="emptyAdd" class="btn btn-solid" type="button">Add city</button>
      </div>
    </main>

    <footer class="foot">
      <span id="saveStatus">Your clocks are saved on this device.</span>
    </footer>
  </div>

  <div class="dock" id="dock">
    <button class="dock-main" id="scrubReset" type="button" aria-disabled="true">Time travel</button>
    <input id="scrub" type="range" min="-1440" max="1440" step="30" value="0" aria-label="Shift all clocks forward or back in time">
    <output id="scrubOut" for="scrub">Now</output>
  </div>

  <div id="palette" class="palette" hidden>
    <div class="palette-backdrop" data-close></div>
    <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Add a time zone">
      <div class="palette-head">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="text" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list"
               placeholder="Search a city, country or time zone" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <button class="btn btn-quiet" type="button" data-close>Done</button>
      </div>
      <ul id="results" class="results" role="listbox" aria-label="Time zones"></ul>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> to move</span>
        <span><kbd>Enter</kbd> to add</span>
        <span><kbd>Esc</kbd> to close</span>
      </div>
    </div>
  </div>

  <script src="zones.js"></script>
  <script src="app.js"></script>
</body>
</html>
